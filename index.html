<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VB Tactics 作戦ボード</title>
<meta name="theme-color" content="#001F43">
<meta name="description" content="バレーボールの守備位置・攻撃戦略を視覚的に共有する作戦ボード">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VB Tactics">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/*
VOICE: 試合中のベンチで一瞬で読める、プロ用の作戦盤。迷いのない操作。
IDEA: 監督が持つマグネット式の作戦ボード。コートが主役、道具はその縁に。
PICTURE: 実寸比のコートSVG。選手駒・ボール・矢印・助走ライン・反則表示。
COLOUR and TYPE: 濃紺 #001F43 の地に黄 #F4E511 を差し色、相手は白×赤。システムフォント（オフライン前提）。
LAYOUT: 左に道具レール、中央にコートとフレーム帯、右に設定パネル。狭い画面では縦積み。
*/
:root{--navy:#001F43;--navy2:#062a57;--navy3:#0d3a73;--line:#1f4a85;--yel:#F4E511;--ink:#EEF3FA;--mut:#9fb3cf;--red:#FF5A5F;--ok:#4fd18b;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--ink);font:15px/1.5 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:12px;padding:calc(8px + var(--safe-t)) calc(14px + var(--safe-r)) 8px calc(14px + var(--safe-l));background:var(--navy);border-bottom:1px solid var(--line);height:calc(60px + var(--safe-t))}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand b{display:block;font-size:17px;letter-spacing:.04em;line-height:1.1;color:var(--yel)}
.brand small{display:block;font-size:11px;color:var(--mut)}
.docname{flex:1;display:flex;gap:8px;align-items:center}
.docname input{width:min(320px,100%);background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 10px;font-weight:700;font-size:16px}
.docname input:hover,.docname input:focus{border-color:var(--line);background:var(--navy2);outline:0}
.acts{display:flex;gap:6px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;min-width:40px;padding:0 12px;border-radius:10px;background:var(--navy2);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--navy3)}
.btn.pri{background:var(--yel);color:var(--navy);border-color:var(--yel)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.ic{padding:0}
.btn:disabled{opacity:.4;cursor:default}
.app{display:grid;grid-template-columns:76px minmax(0,1fr) 340px;height:calc(100dvh - 60px - var(--safe-t))}
.tools{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px calc(10px + var(--safe-b)) calc(6px + var(--safe-l));border-right:1px solid var(--line);overflow-y:auto;background:var(--navy)}
.tool{width:62px;min-height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut)}
.tool:hover{background:var(--navy2);color:var(--ink)}
.tool.on{background:var(--yel);color:var(--navy);font-weight:700}
.sep{width:40px;height:1px;background:var(--line);margin:6px 0;flex:none}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;flex:none;margin:2px}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--navy),0 0 0 4px var(--yel)}
.stage{display:flex;flex-direction:column;min-height:0;background:radial-gradient(120% 90% at 50% 40%,#08305f 0%,var(--navy) 70%)}
.viewbar{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--navy2);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.y{background:var(--yel);color:var(--navy);border-color:var(--yel)}
.chip.r{background:#3a1020;border-color:var(--red);color:#ffd0d2}
.chip.g{background:#0b3a2a;border-color:var(--ok);color:#c9f5dc}
.grow{flex:1}
.seg{display:inline-flex;background:var(--navy2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{min-height:34px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--yel);color:var(--navy)}
.seg.full{display:flex;width:100%}
.seg.mode button{min-height:32px}
body.simple .tool{min-height:64px;font-size:12px}
body.simple .tool svg.i{width:26px;height:26px}
.big{min-height:52px!important;font-size:16px!important}
.mbar{display:none}
.ls{display:none}
@media (max-width:430px){.ll{display:none}.ls{display:inline}#redoBtn{display:none}}
body.magnet .tools,body.magnet .viewbar,body.magnet .frames,body.magnet .panel{display:none}
body.magnet .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:calc(100dvh - 60px - var(--safe-t))}
body.magnet .stage{background:var(--navy)}
body.magnet .courtwrap{margin:12px calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l));border-radius:20px;border:7px solid #c3ccd8;box-shadow:inset 0 0 0 2px #8e9aab,0 10px 30px rgba(0,0,0,.45);background:#062a57;overflow:hidden}
body.magnet .courtwrap{display:flex;flex-direction:column}
body.magnet #court{position:relative;flex:1;min-height:0}
body.magnet .mbar{display:flex;flex:none;order:2;align-items:center;justify-content:center;gap:8px;padding:10px;flex-wrap:wrap;background:#c3ccd8;color:var(--navy);z-index:2}
.mbar .mb{min-height:52px;min-width:52px;padding:0 14px;border-radius:12px;background:#fff;color:var(--navy);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 0 #8e9aab}
.mbar .mb.on{background:var(--navy);color:var(--yel)}
.mbar .mb:disabled{opacity:.4}
.mbar .msw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 0 #8e9aab}
.mbar .msw.on{outline:3px solid var(--navy);outline-offset:2px}
.mbar .rot{display:inline-flex;align-items:center;background:#fff;border-radius:12px;box-shadow:0 2px 0 #8e9aab;min-height:52px}
.mbar .rot b{min-width:76px;text-align:center;font-size:15px}
.mbar .rot button{min-width:46px;min-height:52px;font-size:20px;font-weight:900;color:var(--navy)}
.mbar select{width:auto;height:52px;background:#fff;color:var(--navy);border:0;font-weight:800;box-shadow:0 2px 0 #8e9aab}
.mbar .vr{width:2px;height:36px;background:#8e9aab}
@media (max-width:600px){body.magnet .courtwrap{margin:6px;border-width:5px}body.magnet .mbar{gap:6px;padding:8px}.mbar .mb{min-height:46px;min-width:46px;padding:0 10px;font-size:13px}.mbar .vr{display:none}.mbar .rot,.mbar .rot button,.mbar select{min-height:46px;height:46px}}
.seg.g2{display:grid;grid-template-columns:1fr 1fr}
.seg.full button{flex:1}
.courtwrap{position:relative;flex:1;min-height:260px}
#court{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#court.draw{cursor:crosshair}
#court [data-tok]{cursor:grab}
.frames{display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + var(--safe-b));border-top:1px solid var(--line);background:rgba(0,20,48,.6);overflow-x:auto}
.fchips{display:flex;gap:6px;flex:none}
.fchip{min-width:44px;height:40px;border-radius:10px;background:var(--navy2);border:1px solid var(--line);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0 8px}
.fchip small{font-size:9px;font-weight:500;color:var(--mut)}
.fchip.on{background:var(--yel);color:var(--navy);border-color:var(--yel)}
.fchip.on small{color:var(--navy)}
.frames select{width:auto;background:var(--navy2);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 8px}
.panel{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--navy)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;min-height:46px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;font-size:14px}
.tabs button.on{color:var(--yel);border-bottom-color:var(--yel)}
.pbody{overflow-y:auto;padding:12px 14px calc(24px + var(--safe-b));flex:1;user-select:text;-webkit-user-select:text}
.sec{margin-bottom:16px}
.sec h3{font-size:12px;color:var(--mut);margin:0 0 6px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec h3 .chip{font-size:11px;padding:1px 8px}
.six button{min-width:38px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
select,input[type=text],input[type=number],textarea{background:var(--navy2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:16px;color:var(--ink);width:100%}
select{height:42px;padding:0 8px}
textarea{min-height:70px;resize:vertical}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--navy2);font-size:13px}
.card.bad{border-color:var(--red);background:#2a0f22}
.card.good{border-color:var(--ok);background:#0a2f2c}
.card b{font-size:14px}
.card ul{margin:6px 0 0;padding-left:18px}
.hint{font-size:12px;color:var(--mut);margin:6px 0 0}
table.m{width:100%;border-collapse:collapse;font-size:13px}
table.m th{font-size:11px;color:var(--mut);text-align:left;font-weight:600;padding:2px 3px}
table.m td{padding:3px}
table.m input,table.m select{padding:6px;font-size:15px;height:38px}
table.m td.n{width:30px;text-align:center;font-weight:800;color:var(--yel)}
table.m td.num{width:62px}
table.m td.role{width:84px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(31,74,133,.6);font-size:14px}
.tg input{width:22px;height:22px;accent-color:var(--yel)}
.modal{position:fixed;inset:0;background:rgba(0,10,25,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--navy);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:88dvh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet h2{margin:0;padding:14px 18px;font-size:17px;border-bottom:1px solid var(--line);color:var(--yel)}
.sheet .bd{padding:14px 18px;overflow-y:auto;user-select:text;-webkit-user-select:text}
.sheet .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.lib{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.lib li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--navy2)}
.lib li .t{flex:1}
.lib li .t b{display:block}
.lib li .t small{color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:10px}
.help h4{margin:12px 0 4px;color:var(--yel)}
.help p,.help li{font-size:14px}
kbd{background:var(--navy2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--yel);color:var(--navy);font-weight:700;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media print{body{overflow:visible;background:#fff}.top .acts,.tools,.frames,.panel,.viewbar,#toast{display:none!important}.app{display:block;height:auto}.courtwrap{height:92vh}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:1100px){.app{grid-template-columns:72px minmax(0,1fr) 300px}}
@media (max-width:900px){
 body{overflow:auto}
 .app{grid-template-columns:68px minmax(0,1fr);grid-template-rows:minmax(440px,72dvh) auto;height:auto}
 .panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
 .pbody{overflow:visible}
 .acts .lbl{display:none}
}
@media (max-width:600px){
 .top{gap:6px;padding-inline:10px}
 .brand small,.brand b,.docname input,#fsBtn{display:none}
 .acts{flex:1;justify-content:flex-end;gap:4px}
 .seg.mode{flex-wrap:nowrap;flex:none}
 .seg.mode button{padding:0 7px;font-size:12px}
}
@media (max-width:430px){
 .brand{display:none}
 .top{padding-inline:6px}
 .acts .btn{min-width:38px}
 .docname input{font-size:15px;padding:4px 6px}
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(420px,68dvh) auto}
 .tools{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:6px}
 .tool{width:54px;min-height:48px;flex:none}
 .sep{width:1px;height:36px;margin:0 4px}
 .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
 <div class="brand">
  <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#F4E511"/><circle cx="32" cy="32" r="19" fill="#001F43"/><path d="M32 13c-6 8-6 22 0 38M14 27c9 2 22 0 34-9M17 44c8-7 21-12 33-9" fill="none" stroke="#F4E511" stroke-width="3.2" stroke-linecap="round"/></svg>
  <div><b>VB TACTICS</b><small>バレーボール作戦ボード</small></div>
 </div>
 <div class="docname"><input id="docName" type="text" aria-label="作戦名" maxlength="40"></div>
 <div class="acts">
  <div class="seg mode" id="modeSeg" role="group" aria-label="表示モード"><button data-mode="magnet"><span class="ll">マグネット</span><span class="ls">磁石</span></button><button data-mode="simple">シンプル</button><button data-mode="pro">プロ</button></div>
  <button class="btn ic" id="undoBtn" title="元に戻す (Ctrl+Z)" aria-label="元に戻す"></button>
  <button class="btn ic" id="redoBtn" title="やり直し (Ctrl+Shift+Z)" aria-label="やり直し"></button>
  <button class="btn" id="libBtn" title="作戦ライブラリ"><span data-ico="lib"></span><span class="lbl">ライブラリ</span></button>
  <button class="btn" id="expBtn" title="書き出し"><span data-ico="down"></span><span class="lbl">書き出し</span></button>
  <button class="btn pri" id="installBtn" hidden><span data-ico="install"></span><span class="lbl">インストール</span></button>
  <button class="btn ic" id="fsBtn" title="全画面" aria-label="全画面"></button>
  <button class="btn ic" id="helpBtn" title="使い方" aria-label="使い方"></button>
 </div>
</header>

<main class="app">
 <nav class="tools" id="tools" aria-label="ツール"></nav>
 <section class="stage">
  <div class="viewbar" id="viewbar"></div>
  <div class="courtwrap"><div class="mbar" id="mbar"></div><svg id="court" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="バレーボールコート"><g id="world"><g id="floor"></g><g id="overlay"></g><g id="draws"></g><g id="tokens"></g><g id="preview"></g></g></svg></div>
  <div class="frames" id="frames"></div>
 </section>
 <aside class="panel">
  <div class="tabs" id="tabs"><button data-tab="set">配置・戦術</button><button data-tab="mem">メンバー</button><button data-tab="disp">表示</button></div>
  <div class="pbody" id="pbody"></div>
 </aside>
</main>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><h2 id="mTitle"></h2><div class="bd" id="mBody"></div><div class="ft" id="mFoot"></div></div></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
{
/* ---------- 基本 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const NAVY='#001F43',YEL='#F4E511',RED='#FF5A5F';
const r2=n=>Math.round(n*100)/100;

const ICONS={select:'M5 3l13 7.5-5.6 1.6L10 18z',pen:'M4 20l4-1 11-11-3-3L5 16zM14 6l3 3',arrow:'M5 19L18 6M10 6h8v8',
 ball:'M4 18c2-8 8-12 15-12M15 3l4 3-3 4',zone:'M12 6c5 0 9 2.7 9 6s-4 6-9 6-9-2.7-9-6 4-6 9-6z',text:'M5 7V5h14v2M12 5v14M9 19h6',
 erase:'M15 4l5 5-10 10H5l-2-2zM8.5 9.5l6 6M10 19h10',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',dash:'M3 12h3M9 12h3M15 12h3M21 12h0',
 undo:'M9 14L4 9l5-5M4 9h11a5 5 0 010 10h-4',redo:'M15 14l5-5-5-5M20 9H9a5 5 0 000 10h4',play:'M7 4l13 8-13 8z',pause:'M7 4h3v16H7zM14 4h3v16h-3z',
 plus:'M12 5v14M5 12h14',copy:'M8 8h11v11H8zM5 16V5h11',del:'M6 6l12 12M18 6L6 18',lib:'M4 4h4v16H4zM10 4h4v16h-4zM16 5l4 1-3 14-4-1z',
 down:'M12 4v11M7 10l5 5 5-5M5 20h14',fs:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',help:'M9 9a3 3 0 115 2c-1 .8-2 1.3-2 3M12 18h0M12 21a9 9 0 110-18 9 9 0 010 18z',
 install:'M12 3v12M7 10l5 5 5-5M4 15v5h16v-5',rot:'M4 12a8 8 0 0114-5l2 2M20 4v5h-5M20 12a8 8 0 01-14 5l-2-2M4 20v-5h5',auto:'M12 3l2 5 5 .5-4 3.5 1.5 5L12 14l-4.5 3 1.5-5-4-3.5 5-.5z',
 next:'M5 12h14M13 6l6 6-6 6',save:'M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6'};
const ico=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
document.querySelectorAll('[data-ico]').forEach(el=>el.outerHTML=ico(el.dataset.ico));
$('#undoBtn').innerHTML=ico('undo');$('#redoBtn').innerHTML=ico('redo');$('#fsBtn').innerHTML=ico('fs');$('#helpBtn').innerHTML=ico('help');

/* ---------- バレーボールの定義 ---------- */
const ROLES={S:'セッター',OH:'アウトサイド',MB:'ミドル',OP:'オポジット',L:'リベロ'};
const PHASES={receive:'サーブレシーブ',serve:'サーブ',defense:'ディフェンス',attack:'攻撃'};
const PHASE_SUB={receive:'相手サーブを受ける',serve:'自チームがサーブ',defense:'相手の攻撃を守る',attack:'トランジション攻撃'};
const OPP_PHASE={receive:'serve',serve:'receive',defense:'attack',attack:'defense'};
const NEXT_PHASE={receive:'attack',serve:'defense',defense:'attack',attack:'defense'};

function lineup(team,pre,k,phase,system){
 const E=team.players.map((p,i)=>({id:pre+i,num:p.num,name:p.name,role:p.role,pos:rotPos(i,k)}));
 E.forEach(e=>e.front=e.pos>=2&&e.pos<=4);
 if(team.useLib){
  const c=E.find(e=>e.role==='MB'&&!e.front&&!(phase==='serve'&&e.pos===1));
  if(c){c.sub=c.id;Object.assign(c,{id:pre+'L',num:team.libero.num,name:team.libero.name,role:'L'});}
 }
 const Ss=E.filter(e=>e.role==='S');let st=Ss[0];
 if(system==='4-2')st=Ss.find(e=>e.front)||st;else if(system==='6-2')st=Ss.find(e=>!e.front)||st;
 E.forEach(e=>{e.isSetter=e===st;e.eff=(e.role==='S'&&!e.isSetter)?'OP':e.role;});
 return E;
}
function legalize(L,exempt){
 const keys=Object.keys(L).map(Number);
 for(let pass=0;pass<3;pass++){
  for(let it=0;it<80;it++){
   let moved=false;
   for(const[a,b,ax]of CONS){
    if(exempt&&(a===1||b===1))continue;
    if(!L[a]||!L[b])continue;
    if(ax==='x'){const need=L[b][0]+.3-L[a][0];if(need>0){L[a][0]+=need/2+.01;L[b][0]-=need/2+.01;moved=true;}}
    else{const need=L[a][1]+.3-L[b][1];if(need>0){L[a][1]-=need/2+.01;L[b][1]+=need/2+.01;moved=true;}}
   }
   if(!moved)break;
  }
  if(pass===2)break;
  for(const a of keys)for(const b of keys){if(a>=b)continue;const p=L[a],q=L[b];const d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d>=1.25)continue;
   const c=CONS.find(([x,y])=>(x===a&&y===b)||(x===b&&y===a))||null;const g=(1.25-d)/2+.02;
   if(c&&!(exempt&&(a===1||b===1))){const hi=L[c[0]],lo=L[c[1]];if(c[2]==='x'){hi[0]+=g;lo[0]-=g;}else{hi[1]-=g;lo[1]+=g;}}
   else{const dx=q[0]-p[0],dy=q[1]-p[1],u=d||1,ux=d?dx/u:0,uy=d?dy/u:1;p[0]-=ux*g;p[1]-=uy*g;q[0]+=ux*g;q[1]+=uy*g;}}
 }
 for(const k of keys){L[k][0]=Math.max(-1.6,Math.min(8.75,L[k][0]));L[k][1]=Math.max(-.6,Math.min(9.6,L[k][1]));}
}
function perms(a){if(a.length<2)return[a];const out=[];a.forEach((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).forEach(p=>out.push([x,...p])));return out;}
function recvTargets(E,n,L){
 const setter=E.find(e=>e.isSetter);
 let ps;
 if(n===5)ps=E.filter(e=>e!==setter&&!(e.front&&e.eff==='MB')).concat(E.filter(e=>e.front&&e.eff==='MB'&&e!==setter)).slice(0,5);
 else{
  ps=E.filter(e=>(e.eff==='L'||e.eff==='OH')&&e!==setter);
  const pool=[...E.filter(e=>!e.front&&e!==setter&&!ps.includes(e)),...E.filter(e=>e.front&&e.eff==='OP'&&!ps.includes(e)),...E.filter(e=>e.front&&e.eff==='MB'&&!ps.includes(e))];
  if(n===4){const op=E.find(e=>e.eff==='OP'&&e!==setter&&!ps.includes(e));if(op)ps.push(op);}
  while(ps.length<n&&pool.length){const x=pool.shift();if(!ps.includes(x))ps.push(x);}
  ps=ps.slice(0,n);
 }
 const sp=SPOTS[n].slice(0,ps.length);let best=null,bc=1e9;
 for(const pm of perms(sp.map((_,i)=>i))){let c=0;ps.forEach((e,i)=>{const l=LANE[e.pos],s=sp[pm[i]];c+=(l[0]-s[0])**2*.35+(l[1]-s[1])**2;});if(c<bc){bc=c;best=pm;}}
 ps.forEach((e,i)=>L[e.pos]=[...sp[best[i]]]);
 E.forEach(e=>{if(L[e.pos])return;const ly=LANE[e.pos][1];
  if(e===setter)L[e.pos]=e.front?[8.3,Math.max(2,Math.min(8,ly))]:(e.pos===1?[5.6,8.0]:[5.4,ly]);
  else L[e.pos]=e.front?[8.2,ly]:[0.8,ly];});
}
function assignSlots(E,libSlot){
 const res={},used=new Set();const SY={LF:1.5,MF:4.5,RF:7.5,LB:1.5,CB:4.5,RB:7.5};
 const run=(pool,order,pref)=>{
  for(let lv=0;lv<5;lv++)for(const s of order){if(res[s])continue;
   const c=pool.filter(e=>!used.has(e)&&(pref[s][lv]==='S'?e.isSetter:e.eff===pref[s][lv]));
   if(!c.length)continue;c.sort((a,b)=>Math.abs(LANE[a.pos][1]-SY[s])-Math.abs(LANE[b.pos][1]-SY[s]));res[s]=c[0];used.add(c[0]);}
  for(const s of order)if(!res[s]){const e=pool.find(e=>!used.has(e));if(e){res[s]=e;used.add(e);}}
 };
 run(E.filter(e=>e.front),['MF','RF','LF'],{MF:['MB','OH','OP','S','L'],RF:['S','OP','OH','MB','L'],LF:['OH','OP','MB','S','L']});
 const l5=libSlot===5;
 run(E.filter(e=>!e.front),['RB','LB','CB'],{RB:['S','OP','OH','MB','L'],LB:l5?['L','MB','OH','OP','S']:['OH','OP','L','MB','S'],CB:l5?['OH','OP','L','MB','S']:['L','MB','OH','OP','S']});
 return res;
}
function defPos(sys,side,slot){if(side==='right'){const p=DEF.left[sys][MIR[slot]];return[p[0],9-p[1]];}return[...DEF[side][sys][slot]];}
function atkPos(e,slot,quick,usedPipe){
 if(e.isSetter)return[...SET_SPOT];
 if(slot==='LF')return[5.6,0.4];if(slot==='MF')return[...QUICK[quick].start];if(slot==='RF')return[5.8,8.7];

 if(e.eff==='OP')return[3.3,8.0];

}
function formation(team,pre,k,phase,system,S){
 const E=lineup(team,pre,k,phase,system),P={};
 if(phase==='serve'||phase==='receive'){
  const L={};
  if(phase==='serve'){E.forEach(e=>{const ly=LANE[e.pos][1];L[e.pos]=e.pos===1?[-1.3,7.6]:e.front?[7.6,ly]:[3.4,ly];});legalize(L,true);}
  else{recvTargets(E,S.recv,L);legalize(L,false);}
  E.forEach(e=>P[e.id]=L[e.pos].map(r2));
 }else{
  const sl=assignSlots(E,S.libSlot),up={v:0};
  for(const[s,e]of Object.entries(sl))P[e.id]=(phase==='defense'?defPos(S.defSys,S.side,s):atkPos(e,s,S.quick,up)).map(r2);
 }
 return{E,P};
}
const mirror=p=>[r2(18-p[0]),r2(9-p[1])];
function applyAuto(F,d){
 d=d||doc;const S=d.settings;
 const own=formation(d.teams.own,'o',F.rot.own,F.phase,S.system,S);
 const opp=formation(d.teams.opp,'p',F.rot.opp,OPP_PHASE[F.phase],S.oppSystem,S);
 F.pos={};Object.assign(F.pos,own.P);for(const id in opp.P)F.pos[id]=mirror(opp.P[id]);
 let b;
 if(F.phase==='receive'){const s=opp.E.find(e=>e.pos===1);b=s?mirror(opp.P[s.id]):[19.3,1.4];b=[b[0]-.15,b[1]-.7];}
 else if(F.phase==='serve'){const s=own.E.find(e=>e.pos===1);b=s?[...own.P[s.id]]:[-1.3,7.6];b=[b[0]+.15,b[1]+.7];}
 else if(F.phase==='defense'){b=S.side==='left'?mirror([8.4,0.9]):S.side==='right'?mirror([8.4,8.2]):mirror(QUICK.A.hit);}
 else b=[8.8,6.0];
 F.pos.ball=b.map(r2);
}
function teamCtx(tk,F){
 const S=doc.settings;const ph=tk==='own'?F.phase:OPP_PHASE[F.phase];
 return{ph,E:lineup(doc.teams[tk],tk==='own'?'o':'p',F.rot[tk],ph,tk==='own'?S.system:S.oppSystem)};
}
function faults(tk,F,pos){
 const{ph,E}=teamCtx(tk,F);if(ph!=='receive'&&ph!=='serve')return null;
 const P={};E.forEach(e=>{const p=pos[e.id];if(p)P[e.pos]={e,p:tk==='own'?p:mirror(p)};});
 const out=[];
 for(const[a,b,ax]of CONS){
  if(ph==='serve'&&(a===1||b===1))continue;const A=P[a],B=P[b];if(!A||!B)continue;
  if(ax==='x'&&!(A.p[0]>B.p[0]))out.push({a:A.e,b:B.e,msg:`#${A.e.num}（P${a}）は #${B.e.num}（P${b}）より前（ネット側）にいる必要があります`});
  if(ax==='y'&&!(A.p[1]<B.p[1]))out.push({a:A.e,b:B.e,msg:`#${A.e.num}（P${a}）は #${B.e.num}（P${b}）より${tk==='own'?'左':'左'}側にいる必要があります`});
 }
 return{ph,list:out};
}
function approaches(tk,F,pos){
 const{ph,E}=teamCtx(tk,F);if(ph!=='attack')return[];
 const sl=assignSlots(E,doc.settings.libSlot),out=[],q=QUICK[doc.settings.quick];let pipe=0;
 for(const[s,e]of Object.entries(sl)){
  if(e.isSetter)continue;let h=null;
  if(s==='LF')h=[8.4,0.9,'レフト'];else if(s==='MF')h=[...q.hit,q.label];else if(s==='RF')h=doc.settings.quick==='broad'?[8.4,7.2,'ライト']:[8.4,8.2,'ライト'];
  else if(e.eff==='OH'&&!pipe++)h=[5.7,4.5,'パイプ'];else if(e.eff==='OP')h=[5.7,7.7,'D (バックライト)'];
  if(!h)continue;const hp=tk==='own'?[h[0],h[1]]:mirror([h[0],h[1]]);
  out.push({id:e.id,hit:hp,label:h[2]});
 }
 const st=E.find(e=>e.isSetter);return out.map(o=>({...o,setter:st?st.id:null}));
}

function toWorld(e){const m=world.getScreenCTM().inverse();const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);return[r2(p.x),r2(p.y)];}
const clampP=p=>[r2(Math.max(-2.8,Math.min(20.8,p[0]))),r2(Math.max(-1.8,Math.min(10.8,p[1])))];
let drag=null,drawing=null,erasing=false,playing=null;
const lift=()=>ui.magnet?' scale(1.14)':'';
function liftTok(id){const g=svg.querySelector(`[data-tok="${id}"]`);if(!g)return;g.parentNode.appendChild(g);if(ui.magnet)g.setAttribute('transform',g.getAttribute('transform')+lift());}
svg.addEventListener('pointerdown',e=>{
 if(playing||e.button>0)return;const p=toWorld(e),t=ui.tool;
 if(ui.magnet&&t!=='erase'&&t!=='select'){const tok=e.target.closest('[data-tok]');if(tok){const id=tok.dataset.tok,cur=F().pos[id];drag={kind:'tok',id,off:[p[0]-cur[0],p[1]-cur[1]],moved:false};push();svg.setPointerCapture(e.pointerId);liftTok(id);return;}}
 if(t==='select'){
  const tok=e.target.closest('[data-tok]');
  if(tok){const id=tok.dataset.tok,cur=F().pos[id];drag={kind:'tok',id,off:[p[0]-cur[0],p[1]-cur[1]],moved:false};push();svg.setPointerCapture(e.pointerId);liftTok(id);return;}
  const dr=e.target.closest('[data-draw]');
  if(dr){drag={kind:'draw',i:+dr.dataset.draw,last:p,moved:false};push();svg.setPointerCapture(e.pointerId);}
  return;
 }
 if(t==='erase'){push();erasing={hit:false};eraseAt(e);return;}
 if(t==='text'){textDialog(p);return;}
 svg.setPointerCapture(e.pointerId);
 drawing=t==='pen'?{t,pts:[p],c:ui.color,dash:ui.dash}:{t,a:p,b:p,c:ui.color,dash:ui.dash};
});
svg.addEventListener('pointermove',e=>{
 if(drag){const p=toWorld(e);drag.moved=true;const Fr=F();
  if(drag.kind==='tok'){Fr.pos[drag.id]=clampP([p[0]-drag.off[0],p[1]-drag.off[1]]);
   const g=svg.querySelector(`[data-tok="${drag.id}"]`);if(g)g.setAttribute('transform',`translate(${Fr.pos[drag.id][0]} ${Fr.pos[drag.id][1]})${drag.id==='ball'?'':` rotate(${R()})`}${lift()}`);
   renderOverlay();}
  else{const d=Fr.draws[drag.i],dx=p[0]-drag.last[0],dy=p[1]-drag.last[1];drag.last=p;const mv=q=>[r2(q[0]+dx),r2(q[1]+dy)];
   if(d.pts)d.pts=d.pts.map(mv);if(d.a){d.a=mv(d.a);d.b=mv(d.b);}if(d.p)d.p=mv(d.p);renderDraws();}
  return;}
 if(erasing){eraseAt(e);return;}
 if(drawing){const p=toWorld(e);if(drawing.t==='pen'){const l=drawing.pts[drawing.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>.08)drawing.pts.push(p);}else drawing.b=p;$('#preview').innerHTML=shape(drawing,null);}
});
function endPointer(){
 if(drag){if(!drag.moved){hist.pop();updUndo();renderTokens();}else{renderTokens();renderViewbar();renderCheck();save();}drag=null;}
 if(erasing){if(!erasing.hit){hist.pop();updUndo();}erasing=false;save();}
 if(drawing){const d=drawing;drawing=null;$('#preview').innerHTML='';
  const ok=d.t==='pen'?d.pts.length>2:Math.hypot(d.b[0]-d.a[0],d.b[1]-d.a[1])>.35;
  if(ok){push();if(d.t==='zone'){d.dash=d.dash||false;}F().draws.push(d);renderDraws();save();}}
}

/* ---------- 再生 ---------- */
function stop(){if(playing){cancelAnimationFrame(playing.raf);clearTimeout(playing.to);}playing=null;renderBoard();renderFrames();}
function play(){
 if(playing)return stop();
 if(doc.frames.length<2)return toast('フレームを2つ以上作ると動きを再生できます（＋ボタン）');
 let i=doc.cur>=doc.frames.length-1?0:doc.cur;doc.cur=i;playing={};renderBoard();renderFrames();
 const step=()=>{
  if(!playing)return;
  if(i>=doc.frames.length-1){if(ui.loop){i=0;doc.cur=0;renderBoard();renderFrames();playing.to=setTimeout(step,600/ui.speed);return;}return stop();}
  const A=doc.frames[i],B=doc.frames[i+1],t0=performance.now(),D=1300/ui.speed;
  renderDraws(A);
  const tick=now=>{if(!playing)return;const t=Math.min(1,(now-t0)/D),k=t<.5?2*t*t:1-(-2*t+2)**2/2,pos={};
   for(const id in B.pos){const a=A.pos[id]||B.pos[id],b=B.pos[id];pos[id]=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];}
   renderTokens(B,pos);renderOverlay(B,pos);
   if(t<1)playing.raf=requestAnimationFrame(tick);else{i++;doc.cur=i;renderDraws(B);renderViewbar();renderFrames();playing.to=setTimeout(step,450/ui.speed);}};
  playing.raf=requestAnimationFrame(tick);
 };
 step();
}

  $('#lList').innerHTML=L.length?L.map(x=>`<li><div class="t"><b>${esc(x.name)}</b><small>${esc(x.cat)}・${x.doc.frames.length}フレーム・${new Date(x.t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></div><button class="btn" data-load="${x.id}">開く</button><button class="btn ic" data-rm="${x.id}" aria-label="削除">${ico('trash')}</button></li>`).join(''):'<li class="empty">まだ保存された作戦はありません。<br>上の「この作戦を保存」で登録できます。</li>';};
 list();$('#lQ').oninput=list;
 $('#lSave').onclick=()=>{doc.name=$('#lName').value.trim()||'無題の作戦';doc.cat=$('#lCat').value;const L=getLib();let x=L.find(v=>v.id===ui.libId&&v.name===doc.name);

 $('#lNew').onclick=()=>{push();const keep=clone(doc.teams);doc=newDoc();doc.teams=keep;applyAuto(doc.frames[0]);ui.libId=null;closeM();renderAll();save();toast('新しい作戦を作成しました（メンバーは引き継ぎ）');};
 $('#lList').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.load){const x=getLib().find(v=>v.id===b.dataset.load);if(x){push();doc=clone(x.doc);ui.libId=x.id;closeM();renderAll();save();toast(`「${x.name}」を開きました`);}}
  if(b.dataset.rm){const L=getLib().filter(v=>v.id!==b.dataset.rm);store.set('vbtb.lib',L);list();toast('削除しました');}};
 $('#lImp').onclick=()=>$('#fileIn').click();

/* ---------- 書き出し ---------- */
function download(blob,name){try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}catch(e){toast('この環境ではダウンロードできません');}}
function svgString(){
 const c=svg.cloneNode(true);const vb=svg.getAttribute('viewBox').split(' ').map(Number);
 c.setAttribute('width',vb[2]*80);c.setAttribute('height',vb[3]*80);c.querySelector('#preview')?.remove();
 return new XMLSerializer().serializeToString(c);
}
function exportPNG(){
 const s=svgString(),img=new Image(),vb=svg.getAttribute('viewBox').split(' ').map(Number);
 img.onload=()=>{const cv=document.createElement('canvas');cv.width=vb[2]*80;cv.height=vb[3]*80+(F().note?90:0);const x=cv.getContext('2d');x.fillStyle=NAVY;x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0);
  if(F().note){x.fillStyle=YEL;x.font='bold 30px sans-serif';x.fillText(`${doc.name}（${doc.cur+1}）`,24,vb[3]*80+38);x.fillStyle='#fff';x.font='26px sans-serif';x.fillText(F().note.slice(0,60),24,vb[3]*80+74);}
  cv.toBlob(b=>download(b,`${doc.name}_${doc.cur+1}.png`));};
 img.onerror=()=>toast('画像の作成に失敗しました');
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}
$('#expBtn').onclick=()=>modal('書き出し',`<div class="btnrow" style="flex-direction:column"><button class="btn" id="xPng">現在のフレームをPNG画像で保存</button><button class="btn" id="xJson">作戦データ（JSON）を保存</button><button class="btn" id="xCopy">作戦データをクリップボードへコピー</button><button class="btn" id="xPrint">印刷する</button></div><p class="hint">PNGはLINEやClassroomでの共有、JSONは別の端末での読み込みに使えます。</p>`);

document.addEventListener('keydown',e=>{
 if(e.target.matches('input,textarea,select'))return;
 if(!$('#modal').hidden){if(e.key==='Escape')closeM();return;}
 const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redoF():undo();return;}
 if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redoF();return;}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const T={v:'select',p:'pen',a:'arrow',b:'ball',z:'zone',t:'text',e:'erase'};
 if(T[k]){if(ui.simple&&!SIMPLE_TOOLS.includes(T[k]))return;ui.tool=T[k];renderTools();save();return;}
 if(e.key===' '){e.preventDefault();play();return;}
 if(e.key==='ArrowRight'){if(playing)stop();setFrame(doc.cur+1);}
 if(e.key==='ArrowLeft'){if(playing)stop();setFrame(doc.cur-1);}
 if(k==='n'){ui.showNum=!ui.showNum;renderTokens();renderMbar();if(ui.tab==='disp')renderPanel();save();return;}
 if(k==='r'){push();F().rot.own=(F().rot.own+1)%6;applyAuto(F());renderBoard();renderPanel();save();}
});
renderAll();
}
</script>
</body>
</html>
